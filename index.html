<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lesson-8</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="main">
    <h1 class="title">
      Форма заявки на работу в зоопарке
    </h1>
    <p class="text">
      Пожалуйста, заполните форму. Обязательные поля помечены <span>*</span>
    </p>
    <form class="form" action="">
      <fieldset class="form__title">
        <legend>Контактная информация</legend>
        <label class="form__label">
          <p class="form__input-name">Имя <span>*</span></p>
          <input class="form__input" type="text" name="name">
        </label>
        <label class="form__label">
          <p class="form__input-name">Телефон</p>
          <input class="form__input" type="tel" name="tel">
        </label>
        <label class="form__label">
          <p class="form__input-name">Email <span>*</span></p>
          <input class="form__input" type="email" name="email">
        </label>
      </fieldset>
      <fieldset class="form__title">
        <legend>Персональная информация</legend>
        <label class="form__label">
          <p class="form__input-name">Возраст <span>*</span></p>
          <input class="form__input" type="number" name="age">
        </label>
        <p class="form__select-name">Пол</p>
        <select class="form__select" name="gender" id="">
          <option class="ferm__select-option" value="">Женщина</option>
          <option class="ferm__select-option" value="">Мужчина</option>
        </select>
        <div class="form__textarea-wrap">
          <p class="form__textarea-name">Перечислите личные качества</p>
          <textarea class="form__textarea" name="user-text"></textarea>
        </div>
      </fieldset>
      <fieldset class="form__title form__title-animals">
        <legend>Выберите ваших любимых животных</legend>
        <label class="form__label">
          <input type="checkbox" name="checkbox-1">
          <p class="form__input-text">Зебра</p>
        </label>
        <label class="form__label">
          <input type="checkbox" name="checkbox-2">
          <p class="form__input-text">Кошка</p>
        </label>
        <label class="form__label">
          <input type="checkbox" name="checkbox-3">
          <p class="form__input-text">Анаконда</p>
        </label>
        <label class="form__label">
          <input type="checkbox" name="checkbox-4">
          <p class="form__input-text">Человек</p>
        </label>
        <label class="form__label">
          <input type="checkbox" name="checkbox-5">
          <p class="form__input-text">Слон</p>
        </label>
        <label class="form__label">
          <input type="checkbox" name="checkbox-6">
          <p class="form__input-text">Антилопа</p>
        </label>
        <label class="form__label">
          <input type="checkbox" name="checkbox-7">
          <p class="form__input-text">Голубь</p>
        </label>
        <label class="form__label">
          <input type="checkbox" name="checkbox-8">
          <p class="form__input-text">Краб</p>
        </label>
      </fieldset>
      <button class="form__btn" type="submit">Отправить информацию</button>
    </form>
  </main>
</body>

</html>
